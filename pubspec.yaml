name: habit_flow
description: "HabitFlow — a production-ready habit tracking app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  # No bundled image assets: every icon in this app comes from Material's
  # built-in Icons set, so there is nothing to declare here. (An empty
  # assets/icons/ directory was previously listed, but git doesn't track
  # empty directories, so it silently vanished from the repo on push —
  # this is that dangling reference, removed.)

flutter_intl:
  enabled: true
